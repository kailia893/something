<body>

    <!-- Crucial: The function MUST be tied directly to a user click to prevent the popup blocker -->
    <button onclick="generateSafeWindow()">Open Dynamic Page Safely</button>

    <script>
        function generateSafeWindow() {
            // 1. Your raw HTML code (Supports all quotes and backticks safely)
            const htmlContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Dynamically Generated Page</title>
                    <style>body { font-family: sans-serif; text-align: center; padding: 50px; }</style>
                </head>
                <body>
                    <h1>Success!</h1>
                    <p>This window was opened safely using a secure Blob Object URL.</p>
                </body>
                </html>
            `;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const blobUrl = URL.createObjectURL(blob);
            window.open(blobUrl, '_blank');
        }
    </script>

</body>
