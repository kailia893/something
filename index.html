<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #000;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }

    .banner {
      width: 100%;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
      box-shadow: none;
    }

    .banner img {
      width: 100%;
      height: auto;
      min-height: 100px;
      object-fit: contain;
      display: block;
    }

    .layout {
      display: grid;
      grid-template-columns: 280px minmax(320px, 1fr) 280px;
      gap: 16px;
      padding: 0 16px 16px 16px;
      box-sizing: border-box;
      align-items: start;
    }

    .side-image {
      width: 100%;
      height: 550px;
      background: #fff;
      overflow: hidden;
      box-shadow: none;
    }

    .side-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .center {
      background: #fff;
      padding: 20px;
      box-shadow: none;
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .center.paused {
      background: #fff;
      color: transparent;
    }

    .center.paused * {
      color: transparent !important;
    }

    .pause-overlay {
      position: absolute;
      inset: 0;
      background: #fff;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
    }

    .center.paused .pause-overlay {
      opacity: 1;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
    }

    .controls label,
    .controls button,
    .controls input,
    .status {
      font-family: Arial, sans-serif;
      font-size: 15px;
      color: #000;
    }

    .controls input {
      width: 78px;
      padding: 8px 10px;
      border: 1px solid #000;
      font-size: 15px;
      background: #fff;
      color: #000;
    }

    .controls button {
      border: 1px solid #000;
      background: #000;
      color: #fff;
      cursor: pointer;
      padding: 10px 14px;
      transition: background .2s ease;
    }

    .controls button:hover {
      background: #333;
    }

    .status {
      color: #000;
      min-width: 220px;
    }

    .board {
      display: grid;
      gap: 0;
      background: transparent;
      overflow: hidden;
      flex: 1;
      width: 100%;
      height: 100%;
      place-items: center;
    }

    .cell {
      width: 100%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      font-size: 14px;
      border: none;
      padding: 0;
      cursor: pointer;
      user-select: none;
      background: #fff;
      color: #000;
      min-width: 24px;
    }

    .cell:nth-child(odd) {
      background: #fcfcfc;
    }

    .cell.open {
      background: #fefeff;
      cursor: default;
      color: #000;
      font-weight: 600;
    }

    .cell.open span {
      color: #dadada;
    }

    .cell.open.mine {
      background: #fbffff;
      color: #000;
    }

    .cell.flagged {
      background: #fff5ff;
      color: #000;
    }

    .cell.disabled {
      cursor: not-allowed;
      opacity: .72;
    }

    .cell span {
      pointer-events: none;
    }

    .notice {
      margin-top: 12px;
      font-size: 14px;
      min-height: 20px;
      color: #000;
    }

    .bottom-info {
      margin-top: 8px;
      font-size: 14px;
      color: #000;
    }

    .bottom-info #timerText,
    .bottom-info #mistakesText {
      color: #000;
    }

    @media (max-width: 860px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .side-image {
        max-width: 100%;
      }
    }
  </style>
</head>
