<body>
<script>
let style = document.createElement("style");
style.textContent = `:root {
    --text-color: #000000;
    --font-size: 16px;
}
body {
    font-family: sans-serif;
    color: var(--text-color);
    font-size: var(--font-size);
}`;
document.head.appendChild(style);

let val = 100;
let ui = document.createElement("div");
document.body.appendChild(ui);
let eventt = []; // type, gain, risk, winchance, losechance
function evaluateevent() {
    let ret;
    let random = Math.random();
    if (random < eventt[3]) {
        if (eventt[0] === "Multiply") {
            val *= eventt[1];
            val = Math.ceil(val);
            ret = "Success! Your points have been multiplied by " + eventt[1] + ".";
        }
        else if (eventt[0] === "Add") {
            val += eventt[1];
            val = Math.ceil(val);
            ret = "Success! Your points have been increased by " + eventt[1] + ".";
        }
        else if (eventt[0] === "Square") {
            val *= val;
            val = Math.ceil(val);
            ret = "Success! Your points have been squared.";
        }
    }
    else if (random < eventt[3] + eventt[4]) {
        let lossAmount = Math.floor(val * eventt[2] / 100);
        val -= lossAmount;
        val = Math.ceil(val);
        ret = "You lost " + lossAmount + " points!";
    }
    return ret;
}
function start() {
    let display = document.createElement("div");
    display.textContent = evaluateevent();
    display.textContent += " You now have " + val + " points. Click to continue.";
    display.onclick = gamble;
    ui.textContent = "";
    ui.appendChild(display);
}
function announceevent() {
    let type = Math.random() < 0.2 ? eventt[0] : "unknown";
    let gain = Math.random() < 0.2 ? eventt[1] : "unknown";
    let risk = Math.random() < 0.2 ? eventt[2] : "unknown";
    let winchance = Math.random() < 0.2 ? eventt[3] : "unknown";
    let losechance = Math.random() < 0.2 ? eventt[4] : "unknown";
    let winchancePercent = typeof winchance === "number" ? (winchance*100).toFixed(2) : "unknown";
    let losechancePercent = typeof losechance === "number" ? (losechance*100).toFixed(2) : "unknown";
    return "You have a " + winchancePercent + "% chance to " + type + " your points by " + gain + ". However, you also have a risk of losing to " + risk + " of total value with a " + losechancePercent + "% chance of happening.";
}
function randomevent() {
    let types = ["Square"];
    let type = types[Math.floor(Math.random() * types.length)];
    let gain;
    if (type === "Multiply") {
        gain = (Math.random() * 4 + 1).toFixed(1);
        if (gain > 3 && Math.random() < 0.5) {
            gain = (Math.random() * 2 + 1).toFixed(1);
        }
        if (gain > 4 && Math.random() < 0.2) {
            gain = (Math.random() * 3 + 1).toFixed(1);
        }
    }
    else if (type === "Add") {
        let rate = Math.random() * 4 + 1;
        if (rate > 3 && Math.random() < 0.6) {
            rate = Math.random() * 2 + 1;
        }
        gain = Math.ceil(rate*val);
    }
    else {
        gain = 0;
    }
    let rawrisk;
    if (Math.random() < 0.2) {
        rawrisk = 0.01;
    }
    else {
        rawrisk = Math.random().toFixed(2) * 50 + 50;
    }
    let winchance = Math.random()/1.5;
    if (type === "Square") {
        winchance = Math.random()/3;
    }
    let losechance = (1-winchance)*(Math.random()+0.5);
    if (losechance + winchance > 1) {
        losechance = 1-winchance;
    }
    eventt = [type, gain, rawrisk, winchance, losechance];
}
function gamble() {
    ui.textContent = "You have " + val + " points. Gambling how many points? Enter below";
    randomevent();
    let info = document.createElement("div");
    info.textContent = announceevent();
    ui.appendChild(info);
    let text = document.createElement("textarea");
    ui.appendChild(text);
    let confirm = document.createElement("button");
    confirm.textContent = "Confirm";
    confirm.onclick = function() {
        let multiplier = parseFloat(text.value) || 1;
        eventt[1] *= multiplier;
        eventt[2] *= multiplier;
        start();
    };
    ui.appendChild(confirm);
}
gamble();
</script>
</body>
