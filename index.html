<body>
<script>
let style = document.createElement("style");
style.textContent = `:root {
    --text-color: #000000;
    --font-size: 16px;
}
body {
    font-family: sans-serif;
    color: var(--text-color);
    font-size: var(--font-size);
}`;
document.head.appendChild(style);

let val = 100;
let ui = document.createElement("div");
document.body.appendChild(ui);
let eventt = []; // type, gain, risk, winchance, losechance, addThreshold
let gambleAmount = 0;

function evaluateevent() {
    let ret = "Nothing happened! You kept your gambled points.";
    
    // Check if the event is "Add" and enforce the gamble threshold requirement
    if (eventt[0] === "Add") {
        let requiredGamble = val * eventt[5];
        if (gambleAmount < requiredGamble) {
            val = val + (num - gambleAmount); // Refund points
            return "You didn't gamble enough to trigger the Add event! You needed to risk at least " + (eventt[5] * 100).toFixed(2) + "% of your total points.";
        }
    }

    let random = Math.random();
    
    if (random < eventt[3]) {
        if (eventt[0] === "Multiply") {
            num *= parseFloat(eventt[1]);
            num = Math.ceil(num);
            ret = "Success! Your points were multiplied by " + eventt[1] + ".";
        }
        else if (eventt[0] === "Add") {
            num += parseFloat(eventt[1]);
            num = Math.ceil(num);
            ret = "Success! Your points were increased by " + eventt[1] + ".";
        }
        else if (eventt[0] === "Square") {
            num *= num;
            num = Math.ceil(num);
            ret = "Success! Your points were squared.";
        }
    }
    else if (random < eventt[3] + eventt[4]) {
        let lossAmount = Math.floor(num * parseFloat(eventt[2]) / 100);
        num -= lossAmount;
        num = Math.ceil(num);
        ret = "You lost " + lossAmount + " points!";
    }
    
    val = val + (num - gambleAmount);
    return ret;
}

function start() {
    if (!ready) {
        return;
    }
    let display = document.createElement("div");
    display.textContent = evaluateevent() + " You now have " + val + " points. Click to continue.";
    display.style.cursor = "pointer";
    display.onclick = gamble;
    ui.textContent = "";
    ui.appendChild(display);
}

function announceevent() {
    let type = Math.random() < 0.8 ? eventt[0] : "unknown";
    let gain = Math.random() < 0.8 ? eventt[1] : "unknown";
    let risk = Math.random() < 0.8 ? eventt[2] : "unknown";
    let winchance = Math.random() < 0.8 ? eventt[3] : "unknown";
    let losechance = Math.random() < 0.8 ? eventt[4] : "unknown";
    let threshold = Math.random() < 0.8 ? eventt[5] : "unknown";

    let winStr = typeof winchance === "number" ? (winchance * 100).toFixed(2) + "%" : "an unknown";
    let loseStr = typeof losechance === "number" ? (losechance * 100).toFixed(2) + "%" : "an unknown";
    
    let actionStr = "";
    let reqStr = "";

    if (type === "Square") {
        actionStr = "square your points";
    } else if (type === "Multiply") {
        actionStr = "multiply your points" + (gain !== "unknown" ? " by " + gain : " by an unknown factor");
    } else if (type === "Add") {
        actionStr = "add " + (gain !== "unknown" ? gain : "an unknown amount of") + " points";
        if (threshold !== "unknown") {
            reqStr = " (Requires gambling at least " + (threshold * 100).toFixed(2) + "% of your total points)";
        } else {
            reqStr = " (Requires gambling an unknown minimum percentage of your total points)";
        }
    } else {
        actionStr = "boost your points in an unknown way";
    }

    let riskStr = risk !== "unknown" ? (typeof risk === "number" ? risk.toFixed(2) + "%" : risk + "%") : "an unknown percentage";

    let winChanceText = winStr.endsWith("%") ? "a " + winStr + " chance" : "an unknown chance";
    let loseChanceText = loseStr.endsWith("%") ? "a " + loseStr + " chance" : "an unknown chance";

    return "You have " + winChanceText + " to " + actionStr + reqStr + ". However, you face " + loseChanceText + " of losing " + riskStr + " of your gambled points.";
}

function randomevent() {
    let types = ["Square", "Multiply", "Add"];
    let type = types[Math.floor(Math.random() * types.length)];
    let gain;
    
    if (type === "Multiply") {
        gain = (Math.random() * 4 + 1).toFixed(1);
        if (gain > 3 && Math.random() < 0.5) {
            gain = (Math.random() * 2 + 1).toFixed(1);
        }
        if (gain > 4 && Math.random() < 0.2) {
            gain = (Math.random() * 3 + 1).toFixed(1);
        }
    }
    else if (type === "Add") {
        let rate = Math.random() * 4 + 1;
        if (rate > 3 && Math.random() < 0.6) {
            rate = Math.random() * 2 + 1;
        }
        gain = Math.ceil(rate * val);
    }
    else {
        gain = 0;
    }
    
    // Set risk, winchance, and losechance to randomly be between 10% and 50% (0.1 to 0.5)
    let rawrisk = parseFloat((Math.random() * 40 + 10).toFixed(2));
    let winchance = Math.random() * 0.4 + 0.1; 
    let losechance = Math.random() * 0.4 + 0.1;
    
    // Set minimum threshold for "Add" to randomly be between 10% and 50% (0.1 to 0.5)
    let addThreshold = 0;
    if (type === "Add") {
        addThreshold = Math.random() * 0.4 + 0.1;
    }

    eventt = [type, gain, rawrisk, winchance, losechance, addThreshold];
}

let num = 0;
let ready = false;

function gamble() {
    ui.textContent = "You have " + val + " points. How many points would you like to gamble?";
    ready = false;
    num = 0;
    randomevent();

    let info = document.createElement("div");
    info.style.marginTop = "10px";
    info.textContent = announceevent();
    ui.appendChild(info);

    let inputWrapper = document.createElement("div");
    inputWrapper.style.marginTop = "10px";

    let text = document.createElement("input");
    text.type = "number";
    text.placeholder = "Enter points (0 - " + val + ")";
    
    let errorMsg = document.createElement("div");
    errorMsg.style.color = "red";
    errorMsg.style.fontSize = "14px";

    text.addEventListener("input", function() {
        let parsed = parseInt(text.value.trim(), 10);
        if (!isNaN(parsed) && parsed >= 0 && parsed <= val) {
            num = parsed;
            gambleAmount = num;
            ready = true;
            errorMsg.textContent = "";
        } else {
            ready = false;
            if (text.value.trim() !== "") {
                errorMsg.textContent = "Please enter a valid amount between 0 and " + val;
            } else {
                errorMsg.textContent = "";
            }
        }
    });

    inputWrapper.appendChild(text);
    inputWrapper.appendChild(errorMsg);
    ui.appendChild(inputWrapper);

    let confirm = document.createElement("button");
    confirm.style.marginTop = "10px";
    confirm.textContent = "Confirm";
    confirm.onclick = function() {
        if (!ready) {
            errorMsg.textContent = "Please enter a valid amount before confirming.";
            return;
        }
        start();
    };
    ui.appendChild(confirm);
}

gamble();
</script>
</body>
